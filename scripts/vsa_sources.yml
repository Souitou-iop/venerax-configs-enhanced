# Venera Source Assurance (VSA) 每源测试配置
# 由 scripts/vsa/calibrate.py 校准生成 + 人工维护(受限于声明式受限源与特殊请求头)

defaults:
  timeout_stage: 120
  timeout_image: 60
  delay_between_sources: 3.0

sources:
  copy_manga:
    keyword: "斗罗大陆"

  Komiic:
    entry: explore
    explore_index: 0
    expect: blocked
    blocked_reason: >-
      正文图片需要源内 onImageLoad 注入动态 Authorization/Cookie(Komiic 图片鉴权),
      CLI pages 仅返回 URL, driver 静态头无法携带动态 Token; 待薄 Dart runner 方案后转完整验收

  manga_dex:
    keyword: "one piece"
    expect: blocked
    blocked_reason: >-
      运行时兼容性差异: venera 运行时默认以浏览器 UA 请求, api.mangadex.org 对
      "浏览器 UA + 机房 IP" 返回 bot challenge 页(HTML); 真实客户端在住宅网络下不受影响
    blocked_patterns:
      - "unexpected token"

  zaimanhua:
    entry: explore
    explore_index: 0

  baozi:
    keyword: ""
    expect: blocked
    blocked_reason: >-
      站点主域对运行时 UA/机房 IP 返回 403(镜像域 baozimhcn.com 可用, Layer1 探针走镜像);
      应用内正常, CLI 环境受限
    blocked_patterns:
      - "403" 

  manhuaren:
    keyword: "海贼王"
    image_headers:
      Referer: "https://www.manhuaren.com/"

  ikmmh:
    keyword: ""
    expect: blocked
    blocked_reason: >-
      站点拦截海外/机房网络(403), 仅大陆网络可用
    blocked_patterns:
      - "403"
    # 声明式受限

  ManHuaGui:
    keyword: "斗罗大陆"

  jm:
    entry: explore
    explore_index: 0

  picacg:
    keyword: ""
    expect: blocked
    blocked_reason: >-
      需登录: 签名接口 401, 登录态不属于 CLI 验收范围
    blocked_patterns:
      - "401"
    # 声明式受限

  ehentai:
    entry: explore
    explore_index: 0

  nhentai:
    keyword: "chinese"

