    expect: blocked
    blocked_reason: 站点主域对运行时 UA/机房 IP 返回 403(镜像域 baozimhcn.com 可用, Layer1 探针走镜像);
      应用内正常, CLI 环境受限
    blocked_patterns:
    - '403'
  manhuaren:
    keyword: 海贼王
    image_headers:
