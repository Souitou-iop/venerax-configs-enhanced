    blocked_patterns:
    - '403'
    - Connection refused
    - timed out
    - unexpected token
    - Errno 111
    blocked_reason: cdndm5 图域拦机房 IP(本机可 PASS); 命中即归 BLOCKED, 验收通过时仍 PASS
