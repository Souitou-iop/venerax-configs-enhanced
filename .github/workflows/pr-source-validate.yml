name: PR Source Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Clone latest venera_cli
        run: git clone --depth 1 https://github.com/venera-app/venera_cli.git /tmp/venera_cli

      - name: Get venera_cli dependencies
        working-directory: /tmp/venera_cli
        run: dart pub get

      - name: Build venera_cli
        working-directory: /tmp/venera_cli
        run: dart build cli --target bin/venera.dart --output /tmp/venera

      - name: Collect changed config files
        id: changed-configs
        run: |
          node scripts/list-changed-configs.js > /tmp/changed-configs.txt
          count=$(wc -l < /tmp/changed-configs.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Validate source index
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const sources = JSON.parse(fs.readFileSync('index.json', 'utf8'));
          for (const source of sources) {
            if (!source.fileName || !fs.existsSync(source.fileName)) {
              throw new Error(`Missing indexed source file: ${source.fileName}`);
            }
          }
          console.log(`Validated ${sources.length} indexed source files.`);
          NODE
          for file in *.js; do node --check "$file"; done

      - name: Validate changed config files
        if: steps.changed-configs.outputs.count != '0'
        run: |
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            /tmp/venera/bundle/bin/venera source validate "$file"
          done < /tmp/changed-configs.txt

      - name: No changed config files
        if: steps.changed-configs.outputs.count == '0'
        run: echo "No changed config files to validate."

      # VSA 覆盖率门槛: 正式源必须全部纳管(有测试配置或明确豁免), 无静默漏测
      - name: VSA coverage check
        run: |
          pip install pyyaml
          python scripts/source_assurance.py --check-coverage --output /tmp/vsa_out

      # VSA 离线回归: 本地 fixture 走真实运行时(含 Dart runner)验证框架判定路径
      # (正向 + 截断/HTML充图/SSRF/计数/声明掩盖/Runner异常等负向), 不访问第三方网站。
      - name: VSA offline regression
        run: |
          cd scripts/vsa_dart
          dart pub get
          dart build cli --target bin/vsa_runner.dart --output /tmp/vsa_runner
          cd ../..
          python scripts/source_assurance.py --self-test \
            --runtime /tmp/venera/bundle/bin/venera \
            --runner /tmp/vsa_runner/bundle/bin/vsa_runner \
            --data-dir /tmp/vsa_data \
            --output /tmp/vsa_out
