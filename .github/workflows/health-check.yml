name: Scheduled Comic Sources Health Check & Latency Benchmark

on:
  schedule:
    
    # Target: 08:15 and 20:15 Beijing Time (UTC 00:15 and 12:15).
    # GitHub may delay scheduled runs under platform load; actual start time is recorded in artifacts/README.
    - cron: '15 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: comic-health-check
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  health-check:
    name: Dual-Engine Latency Probe & Auto Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate indexed source files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          sources = json.loads((root / 'index.json').read_text(encoding='utf-8'))
          for source in sources:
              path = root / source['fileName']
              if not path.is_file():
                  raise SystemExit(f"Missing indexed source file: {path}")
          print(f"Validated {len(sources)} indexed source files before probing.")
          PY

      - name: Restore probe runtime state
        uses: actions/cache/restore@v4
        with:
          path: |
            work/e2e_run/copy_device.json
            work/e2e_run/probe_state.json
          key: probe-runtime-state-${{ github.run_id }}
          restore-keys: probe-runtime-state-

      - name: Run E2E Health Check
        id: run_probe
        env:
          PROBE_SSH_KEY: ${{ secrets.PROBE_SSH_KEY }}
          PROBE_HOST: ${{ secrets.PROBE_HOST }}
          PROBE_USER: ${{ secrets.PROBE_USER || 'probe-runner' }}
        run: |
          python scripts/e2e_health_check.py --production
        continue-on-error: true

      - name: Send Alert Issue & Push Notification (if degraded)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "work/e2e_run/has_alert.txt" ] && [ "$(cat work/e2e_run/has_alert.txt)" = "true" ]; then
            echo "🚨 Triggering alert Issue to notify maintainer..."
            gh issue create \
              --title "[🚨 探活异常告警] 漫画源或测速引擎发生严重异常" \
              --body-file "work/e2e_run/health_check_alert.md" \
              --assignee "${{ github.repository_owner }}" \
              --label "bug" || true
          fi

      - name: Commit and Push README Updates
        if: steps.run_probe.outcome == 'success'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet README.md; then
            echo "📝 README.md updated with latest benchmark data, committing..."
            git add README.md
            git commit -m "docs: 自动同步最新双网络环境实测延迟数据 [skip ci]"
            git push origin main
          else
            echo "✅ README.md latency data unchanged, skipping commit."
          fi

      - name: Save probe runtime state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            work/e2e_run/copy_device.json
            work/e2e_run/probe_state.json
          key: probe-runtime-state-${{ github.run_id }}

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run-${{ github.run_id }}
          path: work/e2e_run/
          retention-days: 14

      - name: Propagate Final Status
        if: steps.run_probe.outcome != 'success'
        run: |
          echo "::error::Health check workflow experienced fatal errors. Alert has been dispatched."
          exit 1
