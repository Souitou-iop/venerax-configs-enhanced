name: E2E Probe Trial (Observation Only)

# 试验期专用：端到端内容级探针的观察通道。
# 与正式探针 (health-check.yml, 定时 0:15/12:15 UTC) 完全隔离：
#   - 只读运行：不提交 README、不创建 Issue、不改仓库任何文件
#   - 每次运行把完整明细 (results.json / README 预览 / 告警文件) 打包成 Artifact 供下载
# 观察期结束、判定数据达标后，再决定是否接入正式定时流程。

on:
  workflow_dispatch:
  schedule:
    # 每天 0:45 UTC (北京时间 08:45)，与正式探针错开，积累不同时段的风控/配额样本
    - cron: '45 0 * * *'

permissions:
  contents: read

jobs:
  e2e-trial:
    name: E2E Content-Level Probe (Read-Only Trial)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 拷贝漫画要求稳定设备身份（随机轮换会触发 210 风控）。
      # 首次运行生成并缓存，之后每次运行复用同一身份；缓存 7 天未用才过期，每日调度可长期保活。
      - name: Restore stable copy_manga device identity
        uses: actions/cache@v4
        with:
          path: work/e2e_run/copy_device.json
          key: copy-device-identity-v1

      - name: Run E2E Health Check (observation only)
        run: |
          python scripts/e2e_health_check.py
        continue-on-error: true

      - name: Upload Trial Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run-${{ github.run_id }}
          path: work/e2e_run/
          retention-days: 14
